<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src file:" />
    <title>OpenBot</title>
    <style>
      :root { color-scheme: light dark; --bg: #fff; --fg: #111; --muted: #6b6b6b; --line: #e6e6e6; --card: #f6f6f6; }
      @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #f3f3f3; --muted: #9a9a9a; --line: #262626; --card: #1a1a1a; } }
      html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; }
      body { display: flex; align-items: center; justify-content: center; -webkit-app-region: drag; }
      main { width: 360px; text-align: center; -webkit-app-region: no-drag; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 20px; font-weight: 600; margin: 18px 0 6px; }
      p { color: var(--muted); margin: 0 0 18px; }
      .code { font: 600 28px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.12em; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 0; margin: 0 0 18px; }
      button { font: inherit; font-weight: 500; color: var(--bg); background: var(--fg); border: 0; border-radius: 999px; padding: 9px 18px; cursor: pointer; }
      button.quiet { color: var(--fg); background: transparent; border: 1px solid var(--line); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.png" alt="" />
      <section id="waiting" hidden>
        <h1>Allow this computer</h1>
        <p>Your browser opened OpenBot at <b id="host"></b>. Check that it shows this code and click Allow.</p>
        <div class="code" id="code"></div>
        <button class="quiet" id="open">Open the browser again</button>
      </section>
      <section id="expired" hidden>
        <h1>That code expired</h1>
        <p>Get a new one and allow this computer in your browser.</p>
        <button id="again">Get a new code</button>
      </section>
      <section id="offline" hidden>
        <h1>Can't reach OpenBot</h1>
        <p>This computer can't reach <b class="host"></b>. If OpenBot is on your Tailscale network, check that Tailscale is on.</p>
        <button id="retry">Try again</button>
      </section>
    </main>
    <script>
      const q = new URLSearchParams(location.search)
      const desktop = window.openbotDesktop
      for (const el of document.querySelectorAll("#host, .host")) el.textContent = q.get("host") ?? ""
      const view = q.get("offline") ? "offline" : q.get("expired") ? "expired" : "waiting"
      document.getElementById(view).hidden = false
      document.getElementById("code").textContent = q.get("code") ?? ""
      document.getElementById("open").onclick = () => desktop.openApproval(q.get("approve") ?? "")
      document.getElementById("again").onclick = () => desktop.reconnect()
      document.getElementById("retry").onclick = () => desktop.retry()
    </script>
  </body>
</html>
