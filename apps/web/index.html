<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fcfcfc" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <!-- Add to Home Screen (PWA, no service worker): full-screen, content under the status bar (safe areas). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OpenBot" />
    <meta name="format-detection" content="telephone=no" />
    <title>OpenBot</title>
    <link rel="icon" type="image/svg+xml" href="./public/icon.svg" />
    <link rel="apple-touch-icon" href="./public/apple-touch-icon.png" />
    <link rel="manifest" href="./public/manifest.webmanifest" />
    <link rel="stylesheet" href="./src/app/app.css" />
    <script>
      // Apply the last resolved theme before first paint (the app re-syncs it from settings).
      try {
        var t = localStorage.getItem("openbot.theme")
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        document.documentElement.dataset.theme = t
        var c = t === "light" ? "#fcfcfc" : "#121212"
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.content = c
          m.removeAttribute("media")
        })
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
